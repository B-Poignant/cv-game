# Fly.io (F-084): the Docker image (F-081) on one Machine in Paris.
# App names are unique across Fly.io: change `app` if this one is taken.
app = "cv-game-poignant"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # Colyseus keeps the rooms in memory: exactly one Machine, always on, so every visitor
  # shares the same room and nobody waits for a cold start. Deploy with `--ha=false`.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # A WebSocket is one long connection per visitor.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
