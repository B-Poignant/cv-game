name: CI

on:
  push:
    branches: [main]
    # A release tag runs every check, then publishes the image (F-083).
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cv-game:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container
        run: docker run -d --name cv-game -p 2567:2567 cv-game:ci
      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:2567/health && exit 0
            sleep 1
          done
          exit 1
      - name: Check the game is served
        run: curl -fsS http://localhost:2567/ | grep -q "<title>cv-game</title>"
      - name: Container logs
        if: failure()
        run: docker logs cv-game

  publish:
    name: Publish the image (release tags only)
    runs-on: ubuntu-latest
    # Only a release tag, and only once every check above passed for that commit.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io/<owner>/cv-game (lower-cased), tagged <version>, <major>.<minor> and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
